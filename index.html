<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDF Compressor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f2f4f8;display:flex;justify-content:center;padding-top:60px}
.box{background:#fff;padding:30px;border-radius:12px;width:420px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
h2{margin-top:0}
input,select,button{width:100%;padding:10px;margin:8px 0;box-sizing:border-box;font-size:15px}
button{background:#2563eb;color:#fff;border:0;border-radius:6px;cursor:pointer}
button:disabled{background:#999}
#status{margin-top:10px;font-size:14px;color:#333;white-space:pre-line}
#dl{display:none;text-align:center;background:#16a34a;color:#fff;padding:10px;border-radius:6px;text-decoration:none;margin-top:10px}
#custom{display:none}
</style>
</head>
<body>
<div class="box">
  <h2>PDF Compressor</h2>
  <input type="file" id="file" accept="application/pdf">
  <label>Target size</label>
  <select id="preset">
    <option value="100">100 KB</option>
    <option value="200">200 KB</option>
    <option value="300">300 KB</option>
    <option value="450" selected>450 KB</option>
    <option value="500">500 KB</option>
    <option value="1000">1 MB</option>
    <option value="custom">Custom</option>
  </select>
  <input type="number" id="custom" placeholder="Enter KB" min="50">
  <button id="go">Compress</button>
  <div id="status"></div>
  <a id="dl">Download</a>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
const kb = b => (b / 1024).toFixed(0) + " KB";
const say = t => $("status").textContent = t;

$("preset").onchange = () =>
  $("custom").style.display = $("preset").value === "custom" ? "block" : "none";

function targetBytes() {
  const v = $("preset").value === "custom" ? +$("custom").value : +$("preset").value;
  return (v || 450) * 1024;
}

async function renderPages(pdf, scale) {
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const pg = await pdf.getPage(i);
    const base = pg.getViewport({ scale: 1 });
    const vp = pg.getViewport({ scale });
    const c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await pg.render({ canvasContext: ctx, viewport: vp }).promise;
    pages.push({ c, w: base.width, h: base.height });
  }
  return pages;
}

function buildPdf(pages, q) {
  const { jsPDF } = window.jspdf;
  let doc;
  pages.forEach((p, i) => {
    const o = p.w > p.h ? "l" : "p";
    if (i === 0) doc = new jsPDF({ orientation: o, unit: "pt", format: [p.w, p.h], compress: true });
    else doc.addPage([p.w, p.h], o);
    doc.addImage(p.c.toDataURL("image/jpeg", q), "JPEG", 0, 0, p.w, p.h, undefined, "FAST");
  });
  return doc.output("blob");
}

$("go").onclick = async () => {
  const f = $("file").files[0];
  if (!f) return say("Pick a PDF first.");
  const target = targetBytes();
  $("go").disabled = true; $("dl").style.display = "none";

  try {
    if (f.size <= target) return showResult(f, "Already under target.");

    const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    const scales = [2.5, 2.0, 1.6, 1.3, 1.0, 0.8, 0.6, 0.45];
    let smallest = null, fit = null;

    for (const s of scales) {
      say(`Rendering at scale ${s}...`);
      const pages = await renderPages(pdf, s);

      const low = buildPdf(pages, 0.1);
      if (!smallest || low.size < smallest.size) smallest = low;
      if (low.size > target) continue;

      // Binary search for highest quality under target
      fit = low;
      let lo = 0.1, hi = 0.95;
      for (let k = 0; k < 7; k++) {
        const mid = (lo + hi) / 2;
        say(`Scale ${s}, testing quality ${mid.toFixed(2)}...`);
        const b = buildPdf(pages, mid);
        if (b.size <= target) { fit = b; lo = mid; } else hi = mid;
      }
      break;
    }

    if (fit) showResult(fit, "Done.");
    else showResult(smallest, "Could not reach target. Smallest result saved.");
  } catch (e) {
    say("Error: " + e.message);
  } finally {
    $("go").disabled = false;
  }

  function showResult(blob, msg) {
    say(`${msg}\nOriginal: ${kb(f.size)}\nNew: ${kb(blob.size)}`);
    const a = $("dl");
    a.href = URL.createObjectURL(blob);
    a.download = f.name.replace(/\.pdf$/i, "") + "-compressed.pdf";
    a.style.display = "block";
  }
};
</script>
</body>
</html>
